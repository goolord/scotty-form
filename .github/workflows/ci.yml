name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.6", "9.8", "9.10", "9.12", "9.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: goolord/ditto
          path: ditto

      - uses: actions/checkout@v5
        with:
          repository: goolord/ditto-lucid
          path: ditto-lucid

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "latest"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - run: cabal update

      - name: Wire in-repo ditto packages
        run: |
          cat > cabal.project.local <<'EOF'
          packages:
            ./ditto
            ./ditto-lucid
          EOF

      - run: cabal build all --ghc-options="-Werror -Wno-error=orphans"
